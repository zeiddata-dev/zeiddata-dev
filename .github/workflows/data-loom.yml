name: Refresh Data Loom

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: data-loom
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the generator
        run: node --test scripts/data-loom.test.mjs
      - name: Backfill public history and render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/data-loom.mjs "${{ github.repository_owner }}"
      - name: Publish the complete snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data-loom.svg data/data-loom.json data/data-loom.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh categorized public work loom'
          git pull --rebase origin main
          git push origin HEAD:main
